<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Simulador Previdenciário</title><style>:root{--bg:#f4f7fb;--card:#fff;--txt:#102033;--muted:#6b7280;--pri:#2563eb;--ok:#16a34a;--bad:#dc2626}*{box-sizing:border-box}body{margin:0;font-family:Inter,Arial,sans-serif;background:linear-gradient(180deg,#eef4ff,#f8fafc);color:var(--txt)}.shell{max-width:980px;margin:0 auto;padding:20px}.hero{background:var(--card);border-radius:22px;padding:24px;box-shadow:0 10px 30px rgba(15,23,42,.08)}.hero h1{margin:0 0 6px;font-size:30px}.hero p{margin:0;color:var(--muted)}.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin:16px 0}.stat{background:var(--card);border-radius:16px;padding:14px 16px;box-shadow:0 8px 18px rgba(15,23,42,.05)}.stat b{display:block;font-size:22px;margin-top:4px}.panel{background:var(--card);border-radius:22px;padding:20px;box-shadow:0 10px 30px rgba(15,23,42,.08)}.qhead{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:center;margin-bottom:14px}.qtitle{font-size:22px;font-weight:700;line-height:1.25}.progress{height:10px;background:#e5e7eb;border-radius:999px;overflow:hidden}.bar{height:100%;background:linear-gradient(90deg,#2563eb,#60a5fa);width:0%}.qtext{font-size:20px;font-weight:700;margin:14px 0 16px}.opts{display:grid;gap:10px}.opt{width:100%;text-align:left;border:1px solid #dbe3ef;background:#fff;border-radius:14px;padding:14px 16px;font-size:16px;cursor:pointer;transition:.15s}.opt:hover{border-color:#93c5fd;transform:translateY(-1px)}.opt.correct{background:#dcfce7;border-color:#86efac}.opt.wrong{background:#fee2e2;border-color:#fca5a5}.controls{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-top:18px;flex-wrap:wrap}.btn{border:0;border-radius:12px;padding:12px 18px;font-size:15px;font-weight:700;cursor:pointer}.btn.primary{background:var(--pri);color:#fff}.btn.ghost{background:#e5e7eb;color:#111827}.feedback{margin-top:10px;font-weight:700;min-height:24px}.result{display:none}.result.show{display:block}.finalscore{font-size:30px;font-weight:800}.small{color:var(--muted);font-size:14px}.row{display:flex;gap:10px;flex-wrap:wrap}.pill{padding:8px 12px;border-radius:999px;background:#eff6ff;color:#1d4ed8;font-weight:700;font-size:13px}@media (max-width:760px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.qtext{font-size:18px}.hero h1{font-size:24px}}</style></head><body><div class="shell"><div class="hero"><h1>Simulador Previdenciário</h1><p>Questões de múltipla escolha com correção imediata, pontuação e navegação simples.</p><div class="row" style="margin-top:14px"><div class="pill">20 questões</div><div class="pill">Feedback imediato</div><div class="pill">Modo prova</div></div></div><div class="stats"><div class="stat"><span>Questão</span><b id="qnum">1/20</b></div><div class="stat"><span>Acertos</span><b id="hits">0</b></div><div class="stat"><span>Erros</span><b id="miss">0</b></div><div class="stat"><span>Progresso</span><b id="pct">0%</b></div></div><div class="panel"><div class="qhead"><div class="qtitle">Questão <span id="cur">1</span></div><div class="small" id="status">Responda para liberar a próxima.</div></div><div class="progress"><div class="bar" id="bar"></div></div><div class="qtext" id="qtext"></div><div class="opts" id="opts"></div><div class="feedback" id="fb"></div><div class="controls"><button class="btn ghost" id="prev">Anterior</button><button class="btn primary" id="next">Próxima</button></div></div><div class="panel result" id="result" style="margin-top:16px"><div class="finalscore" id="finalscore"></div><p id="finaltext"></p><button class="btn primary" id="restart">Refazer simulador</button></div></div><script>const data=[["O que vem a ser o princípio da Universalidade de direitos no plano da Seguridade Social?", ["atendimento a todos os nacionais apenas.", "atendimento todos os nacionais que contribuem para Previdência Social.", "atendimento todas os nacionais e estrangeiros que contribuam ou não para a Previdência Social.", "atendimento apenas aos estrangeiros que trabalham no Brasil.", "atendimento a todos os nacionais exceto os estrangeiros."], 2], ["Quais os tipos de segurados que a Previdência Social reconhece?", ["segurado obrigatório.", "contribuinte individual.", "segurado facultativo.", "segurados obrigatório e facultativo.", "segurado ocasional."], 3], ["São dependentes de 2ª classe:", ["irmão e irmã.", "companheiro e companheira.", "pais.", "filhos legitimados.", "filhos adotivos."], 2], ["O que vem a ser carência?", ["período de tempo apenas para aposentar por tempo de contribuição.", "período mínimo de contribuições para obter um benefício qualquer da Previdência Social.", "período máximo para obter a aposentadoria por idade.", "período máximo para obter auxílio por incapacidade temporária.", "número de contribuições mínimas para obter o benefício de prestação continuada."], 1], ["Auxílio por incapacidade temporária, quando é deferido?", ["apenas quando o segurado empregado que se acidenta ou tem problemas de saúde.", "para todos os segurados quando se acidenta ou tem problemas de saúde.", "para todos os segurados obrigatório apenas quando se acidenta ou tem problemas de saúde.", "para os segurados facultativos apenas quando se acidenta ou tem problemas de saúde.", "para os dependentes quando se acidentam ou tem problemas de saúde."], 1], ["O que vem a ser salário de contribuição.", ["É uma forma de remuneração dos empregados junto a Previdência Social.", "É a base de cálculo para calcular o valor benefício previdenciário.", "É a base de cálculo do ganho mensal de todos os segurados da Previdência Social.", "É a base de cálculo do ganho mensal apenas dos contribuintes individuais.", "É a forma de remuneração dos benefícios a favor dos dependentes."], 2], ["É independente de carência o seguinte benefício.", ["aposentadoria por idade", "auxílio de incapacidade temporária", "auxílio de incapacidade temporária acidentária.", "aposentadoria especial", "aposentadoria de incapacidade definitiva."], 2], ["Período de graça, o que significa?", ["período de tempo que o empregado pode ficar sem receber o benefício por alguma irregularidade", "período de tempo que os segurados podem mesmo sem contribuir obter benefícios da Previdência Social.", "período de tempo que os segurados obrigatórios podem ficar sem receber benefício previdenciário por alguma irregularidade", "período de tempo que os segurados facultativos podem ficar sem receber benefício previdenciário por alguma irregularidade", "para os dependentes quando se acidentam ou tem problemas de saúde."], 1], ["O que significa 'perda da qualidade de ser segurado da Previdência'.", ["É o segurado deixa de contribuir por 2 meses apenas", "É o segurado deixar de contribuir para a Previdência e passar do período de graça.", "É o segurado deixa de contribuir para a assistência social", "É o segurado deixa de contribuir por 3 meses apenas", "Uma vez segurado da Previdência Social, a sua qualidade de segurado sempre ficará mantida independente de contribuir ou não para a Previdência Social."], 1], ["Salário de benefício o que vem a ser?", ["É o valor do benefício previdenciário dos segurados e seus dependentes quando faltarem.", "É a média aritmética para apuração do valor da renda mensal inicial que apenas o segurado ou dependente faz jus.", "É o valor do salário dos empregados perante a Previdência.", "É a média aritmética para apuração o valor efetivo que apenas o segurado faz jus.", "É o valor do benefício previdenciário aos segurados."], 1], ["Qual a carência exigida para a concessão de auxílio por incapacidade temporária acidentária.", ["independente de carência.", "12 meses de contribuição", "12 meses de contribuição", "18 meses de contribuição", "30 meses de contribuição"], 0], ["Qual a carência exigida para a concessão de auxílio por incapacidade temporária?", ["12 meses de contribuição", "6 meses de contribuição", "18 meses de contribuição", "24 meses de contribuição", "30 meses de contribuição"], 0], ["Aposentadoria por idade para mulher, após a reforma da Previdência em 2019 é", ["15 anos de contribuição e 62 anos de idade", "15 anos de contribuição e 62 anos de idade", "20 anos de contribuição e 65 anos de idade, o que chegar primeiro", "15 anos de contribuição e 65 anos de idade", "65 anos sem contribuição para a Previdência"], 0], ["Qual a carência exigida para a concessão da aposentadoria por incapacidade definitiva", ["12 meses de contribuição.", "10 meses de contribuição.", "18 meses de contribuição.", "24 meses de contribuição.", "21 meses de contribuição."], 0], ["Aposentadoria por idade para homem, após a reforma de 2019 é:", ["20 anos de contribuição ou 65 anos de idade, o que chegar primeiro.", "15 anos de contribuição ou 65 anos de idade, o que chegar primeiro.", "20 anos de contribuição e 65 anos de idade.", "15 anos de contribuição e 65 anos de idade.", "15 anos de contribuição e 62 anos de idade."], 0], ["O Salário maternidade é concedido para...", ["os pais da criança", "somente para a mãe biológica", "para a mãe biológica, ou adotiva ou de termo de guarda para fins de adoção", "apenas para o casal biológico", "mãe biológica e adotiva apenas"], 2], ["A emenda constitucional 109/19, que trouxe a reforma da previdência, onde acarretou a extinção do seguinte benefício previdenciário", ["abono de permanência", "aposentadoria especial", "aposentadoria por idade", "aposentadoria por tempo de serviço", "aposentadoria por tempo de contribuição"], 4], ["Das aposentadoria abaixo arroladas qual delas é reversível?", ["aposentadoria por idade", "aposentadoria por incapacidade definitiva", "aposentadoria especial", "aposentadoria por tempo de contribuição", "aposentadoria por tempo de serviço"], 1], ["O auxílio acidente é um benefício cuja alíquota a ser aplicada é de", ["50%", "100%", "90%", "alíquota de 100%", "cota familiar de 50%"], 0], ["A Emenda Constitucional 103/19 estabeleceu para a pensão por morte da seguinte forma:", ["uma cota familiar de 50 % acrescido de 10% por dependente até o máximo de 100%", "uma cota familiar de 60 % acrescido de 10% por dependente até o máximo de 100%", "uma cota familiar de 40 % acrescido de 10% por dependente até o máximo de 100%", "alíquota de 100%", "cota familiar de 50%"], 0]];let i=0,score=0,wrong=0;const answers=Array(data.length).fill(null);const qnum=document.getElementById('qnum'),hits=document.getElementById('hits'),miss=document.getElementById('miss'),pct=document.getElementById('pct'),bar=document.getElementById('bar'),cur=document.getElementById('cur'),qtext=document.getElementById('qtext'),opts=document.getElementById('opts'),fb=document.getElementById('fb'),status=document.getElementById('status'),panel=document.querySelector('.panel'),result=document.getElementById('result'),finalscore=document.getElementById('finalscore'),finaltext=document.getElementById('finaltext');function render(){const q=data[i];qnum.textContent=(i+1)+'/'+data.length;cur.textContent=i+1;qtext.textContent=q[0];opts.innerHTML='';fb.textContent='';status.textContent=answers[i]===null?'Responda para liberar a próxima.':'Questão respondida.';q[1].forEach((t,idx)=>{const b=document.createElement('button');b.className='opt';b.textContent=String.fromCharCode(65+idx)+'. '+t;if(answers[i]!==null){b.disabled=true;if(idx===q[2])b.classList.add('correct');if(answers[i]===idx&&idx!==q[2])b.classList.add('wrong')}b.onclick=()=>choose(idx);opts.appendChild(b)});const done=answers.filter(v=>v!==null).length;bar.style.width=(done/data.length*100)+'%';pct.textContent=Math.round(done/data.length*100)+'%';hits.textContent=score;miss.textContent=wrong;document.getElementById('prev').disabled=i===0;document.getElementById('next').textContent=i===data.length-1?'Finalizar':'Próxima';if(done===data.length){panel.style.display='none';result.classList.add('show');finalscore.textContent='Pontuação: '+score+'/'+data.length;finaltext.textContent='Você concluiu o simulador com correção imediata em todas as questões.'}}function choose(idx){if(answers[i]!==null)return;answers[i]=idx;if(idx===data[i][2]){score++;fb.style.color='var(--ok)';fb.textContent='Correto! Gabarito: '+String.fromCharCode(65+data[i][2])+'.'}else{wrong++;fb.style.color='var(--bad)';fb.textContent='Incorreto. Gabarito: '+String.fromCharCode(65+data[i][2])+'.'}render()}document.getElementById('prev').onclick=()=>{if(i>0){i--;render()}};document.getElementById('next').onclick=()=>{if(i<data.length-1){i++;render()}else{for(let k=0;k<data.length;k++)if(answers[k]===null)answers[k]=data[k][2];render()}};document.getElementById('restart').onclick=()=>{i=0;score=0;wrong=0;for(let k=0;k<answers.length;k++)answers[k]=null;panel.style.display='block';result.classList.remove('show');render()};render();</script></body></html>
